design_notes:
  - "kind 'capability' + context 'code' grades as verdict 'capability' in code files (verifier.py VERDICT_ORDER exploitable 4 > capability 3 > inconclusive 2 > low_trust 1). AC1 is satisfied by kind=capability with no escalate_pattern, and must NOT be demoted by a cancel word / NAMED_EXAMPLE / PLACEHOLDER on the line."
  - "requires_pattern is file-level; when satisfied in a code file it sets escalates=True -> verdict 'exploitable' (verifier.py lines 311-317). That is the lever for AC3."
  - "A regex with two (?m) groups is invalid ('global flags not at the start') — one (?m) at the very start only (this bit the prototype)."
  - "scanner.py already has _stage2_payloads() (base64/hex blob var + exec on another line, F7), but it only fires when the DECODED text matches a rule, so subprocess.check_output([b64decode(B)]) slips through. SS042's requires_pattern closes that without duplicating _stage2_payloads."
  - "rules.json stays ordered; append after SS039. tests/test_skillsentinel.py asserts ^SS\\d{3}$ and the 10 required categories — SS040 obfuscation, SS041 exfiltration, SS042 obfuscation are already-covered categories, so no test edit is needed."

new_rules:
  SS040:
    title: Dynamic code execution of a runtime-built value
    category: obfuscation
    severity: high
    owasp: ASI-06
    kind: capability
    context: code
    pattern: |
      (?<!re\.)(?<!ast\.)\b(?:exec|eval|compile)\s*\(\s*(?!['"])(?!(?:base64|b64d|b64|binascii|codecs|gzip|zlib|marshal|pickle|bytes|bytearray|json|yaml)\b)(?:os\.environ|os\.getenv|environ\b|getenv\s*\(|getattr\s*\(|globals\s*\(|locals\s*\(|vars\s*\(|sys\.argv|sys\.stdin|input\s*\(|open\s*\(|[A-Za-z_]\w*\s*[\[.)])
    escalate_pattern: |
      \b(?:exec|eval|compile)\s*\(
  SS041:
    title: Raw-IP socket connection (C2 or exfil by address)
    category: exfiltration
    severity: critical
    owasp: ASI-09
    kind: capability
    context: code
    pattern: |
      (?:socket\.create_connection|socket\.socket\s*\(|\.connect\s*\(|\.sendto\s*\(|\.sendall\s*\()[^\n]{0,80}?(?<![\d.])(?!127\.|0\.0\.0\.0|255\.255\.255\.255)(?:\d{1,3}\.){3}\d{1,3}['"]?\s*[,)]
    escalate_pattern: |
      socket\.|\.connect\s*\(|\.sendall|\.sendto|\.recv
  SS042:
    title: "Obfuscated payload: blob in a variable reaches an interpreter"
    category: obfuscation
    severity: high
    owasp: ASI-01
    kind: capability
    context: code
    pattern: |
      (?:\b(?:base64\.)?b64decode|\batob|\bbytes\.fromhex|\bbinascii\.unhexlify)\s*\(\s*[A-Za-z_]\w*\s*\)|\bcodecs\.decode\s*\(\s*[A-Za-z_]\w*\s*,\s*['"]hex['"]\s*\)
    requires_pattern: |
      (?m)^[ \t]*(?:[A-Za-z_]\w*[ \t]*=[ \t]*['"]?(?<![A-Za-z0-9+/])[A-Za-z0-9+/]{16,79}(?![A-Za-z0-9+/])['"]?|[A-Za-z_]\w*[ \t]*=[ \t]*['"][0-9a-fA-F]{16,79}['"])[ \t]*$
    escalate_pattern: |
      \b(?:exec|eval|compile|subprocess|os\.system|popen|check_output|check_call|Popen)\b

