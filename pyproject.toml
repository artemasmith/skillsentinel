[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsentinel"
version = "0.1.0"
description = "Post-install security scanner for AI-agent skills and prompt configs: prompt injection, unicode smuggling, exfil, miners, persistence, MCP backdoors, drift detection and sandboxed detonation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Artem Kuznetsov" }]
keywords = ["security", "prompt-injection", "ai-agents", "skills", "mcp", "supply-chain", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
skillsentinel = "skillsentinel.cli:main"

[project.urls]
Homepage = "https://github.com/artemasmith/skillsentinel"

[tool.setuptools]
packages = ["skillsentinel"]

[tool.setuptools.data-files]
"share/skillsentinel/rules" = ["rules/rules.json"]
