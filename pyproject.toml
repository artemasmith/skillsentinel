[build-system]
# setuptools 77 is the first release with PEP 639 (SPDX license expression).
# A lower pin silently re-emits the deprecated license table on every build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsentinel-cli"
version = "0.3.2"
description = "Post-install security scanner for AI-agent skills and prompt configs: prompt injection, unicode smuggling, exfil, miners, persistence, MCP backdoors, drift detection and sandboxed detonation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Artem Kuznetsov" }]
keywords = ["security", "prompt-injection", "ai-agents", "skills", "mcp", "supply-chain", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
skillsentinel = "skillsentinel.cli:main"

[project.urls]
Homepage = "https://github.com/artemasmith/skillsentinel"
Changelog = "https://github.com/artemasmith/skillsentinel/blob/main/CHANGELOG.md"
Issues = "https://github.com/artemasmith/skillsentinel/issues"
PyPI = "https://pypi.org/project/skillsentinel-cli/"

[tool.setuptools]
packages = ["skillsentinel"]

[tool.setuptools.data-files]
"share/skillsentinel/rules" = ["rules/rules.json"]
