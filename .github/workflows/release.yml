name: release

# Tag-driven only: cutting a release is an explicit act (git tag v*), never a
# side effect of pushing to a branch.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # create the GitHub Release and attach artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # the CHANGELOG lives in the repo, not in the artifact
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import pathlib, re, sys

          tag = sys.argv[1].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          headers = [(m.start(), m.group(0))
                     for m in re.finditer(r"^## .*$", text, re.M)]
          exact = [s for s, h in headers if re.search(rf"\[{re.escape(tag)}\]", h)]
          staged = [s for s, h in headers
                    if re.search(rf"\b{re.escape(tag)}\b", h)]
          start = (exact or staged or [None])[0]
          if start is None:
              sys.exit(f"CHANGELOG.md has no section for {tag}")
          later = [s for s, _ in headers if s > start]
          section = text[start:later[0] if later else len(text)]
          pathlib.Path("release_notes.md").write_text(
              section.strip() + "\n", encoding="utf-8")
          PY
      - name: Create GitHub Release with the artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          # Idempotent: re-cutting a tag (e.g. to pick up a CI-only fix) must
          # update the release instead of failing on the assets that are there.
          overwrite_files: true
      - name: Drop release assets left by an older distribution name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `overwrite_files` replaces same-named assets but never removes the
          # orphans of a rename, so a re-cut tag could ship two wheels. Keep only
          # the files this build produced, named after the current project name.
          pyproject="$(python3 - <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          print(project["name"], project["version"])
          PY
          )"
          dist="$(echo "$pyproject" | cut -d' ' -f1)"
          ver="$(echo "$pyproject" | cut -d' ' -f2)"
          keep="$(echo "$dist" | tr '-' '_')"
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | while read -r a; do
            case "$a" in
              "$keep-$ver"*.whl|"$keep-$ver"*.tar.gz|"$dist-$ver"*.whl|"$dist-$ver"*.tar.gz) ;;
              *) echo "deleting stale release asset: $a"
                 gh release delete-asset "$GITHUB_REF_NAME" "$a" -y ;;
            esac
          done

  publish:
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish to PyPI (only when PYPI_API_TOKEN is set)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # The token value is never echoed; only presence, length and shape are tested.
          TOKEN="$(printf '%s' "${TWINE_PASSWORD:-}" | tr -d ' \t\r\n')"
          if [ -z "$TOKEN" ]; then
            echo "PYPI_API_TOKEN is not set — release artifacts built and attached, PyPI publish skipped."
            exit 0
          fi
          if [ "$TOKEN" = "${TWINE_PASSWORD}" ]; then
            echo "token: present, ${#TOKEN} chars, no stray whitespace"
          else
            echo "token: present, ${#TOKEN} chars, stray whitespace stripped before use"
          fi
          code=$(curl -s -o /tmp/probe.txt -w '%{http_code}' -u "__token:${TOKEN}" \
                 -F ':action=submit' https://upload.pypi.org/legacy/ || echo 000)
          echo "token probe (empty form, registers nothing): HTTP ${code}"
          python3 -m pip install --upgrade --quiet twine
          set +e
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$TOKEN" \
            python3 -m twine upload --non-interactive --disable-progress-bar \
              --skip-existing dist/* > /tmp/twine.log 2>&1
          rc=$?
          set -e
          cat /tmp/twine.log
          if [ "$rc" -ne 0 ]; then
            msg=$(tr '\n' ' ' < /tmp/twine.log | sed 's/%/%25/g' | cut -c1-800)
            echo "::error::twine upload failed rc=${rc} token_probe_http=${code} :: ${msg}"
            exit "$rc"
          fi
