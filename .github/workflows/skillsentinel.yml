name: skillsentinel

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # daily drift scan of this very repo's agent configs

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  bench:
    # Performance gate: a minified-bundle-shaped 800 KB single line must scan
    # in ≤ 8 s and no single rule may take > 0.5 s on it. Budgets are
    # wall-clock ceilings, not per-machine targets — C1 guarantees the scan
    # is linear-bounded, so a blow-up here means a regression, not slow CI.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan-speed gate (800KB line <= 8s, each rule <= 0.5s)
        run: python3 tools/bench_scan.py --line 800KB --budget 8 --rule-budget 0.5

  self-scan:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload-sarif posts the repo self-scan to the Security tab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan malicious fixtures (expect findings, exit 1)
        run: |
          set +e
          python3 -m skillsentinel scan tests/fixtures/malicious --sarif fixtures.sarif --severity critical --timeout 300
          RC=$?
          set -e
          if [ "$RC" -ne 1 ]; then
            echo "expected exit 1 on malicious fixtures, got $RC"; exit 1
          fi
      - name: Scan repo itself (expect clean; this SARIF feeds the Security tab)
        # --honor-ignores is OFF by default so that a scanned skill cannot silence
        # its own detection. This repo's own tree is trusted, and
        # .skillsentinelignore (the rule catalog + malicious fixtures) is exactly
        # the case the flag exists for.
        #
        # The SARIF uploaded to the Security tab MUST come from this scan, never
        # from the fixture scan: the fixtures file is our own attack corpus, so
        # uploading it published ~43 fake critical alerts (all under
        # tests/fixtures/malicious/) on a public repo's Security tab — read by
        # every visitor as real defects. Gate: tests/test_c4_ci.py.
        run: python3 -m skillsentinel scan . --sarif scan.sarif --severity medium --honor-ignores --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillsentinel-sarif
          path: |
            scan.sarif
            fixtures.sarif
      - name: Upload SARIF to the GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()  # the self-scan result must land in the Security tab even when the job failed
        with:
          sarif_file: scan.sarif
          category: skillsentinel
